# EXAMPLE POLICY — REMOVABLE PLACEHOLDER + canonical, fully-commented manifest.
#
# This folder exists for two reasons:
#   1. so the gallery renders something before any real policy is committed, and
#   2. as the reference example of every `policy.yaml` field.
# Delete `policies/_example/` once the first real policy lands. The registry
# (src/registry.ts) treats the `_example` id specially and sorts it last.
#
# This file is the FINAL schema (issue wbc-mjlab-0d8). It is validated against
# policies/policy.schema.json by both the gallery build and `npm run validate`.
# See policies/README.md for the full field reference and folder layout.
#
# NOTE: the artifact pointers below (onnx/config/clips/thumbnail) are shown for
# documentation. The schema validates the manifest TEXT, not file existence, so
# this example validates even though `_example/` ships no real artifacts. A REAL
# policy folder must actually contain the files it points at.

schemaVersion: "1"          # required — manifest schema version (currently "1")

# id: example               # optional — folder name is authoritative; omit it
name: "Example Policy"       # required — display name on the card and page
description: "Placeholder so the gallery isn't empty. Remove me once a real policy is added."

robot: "g1"                  # optional — embodiment id; matches config.yaml's
                             #   robot_id / motion_library.yaml's robot. Selects
                             #   the robot GLB (issue wbc-mjlab-9as).

tags: ["walk", "locomotion", "example"]   # optional — known tags suggested
                                          #   (walk/run/fight/flip/getup/dance/…),
                                          #   arbitrary tags allowed.

author: "wbc-mjlab"          # optional — contributor name or handle

links:                       # optional — surfaced on the policy page
  paper: "https://example.com/paper"
  code: "https://github.com/wbc-mjlab/wbc-mjlab"
  runUrl: "https://wandb.ai/wbc-mjlab/example/runs/abc123"

thumbnail: "thumb.png"       # optional — gallery card image, relative to folder

defaultClip: "walk-forward"  # optional — clip id to show first on the page

# Camera framing: a named preset ("default" | "front" | "side" | "top" |
# "orbit") OR an explicit pose. Explicit form maps onto the Three.js viewport:
#   pos    -> camera.position
#   target -> orbit/look-at target
# (world-space metres, Three.js axes, Y up — see src/viewer/renderer.ts).
camera:
  pos: [2.5, 1.8, 3.0]
  target: [0.0, 0.8, 0.0]
# camera: default            # ...or just a preset name.

# Pointers to the policy's machine artifacts (emitted by the exporter,
# issue wbc-mjlab-5uw). Paths are RELATIVE to this folder. Optional for an M1
# metadata-only card; required for the M2 live engine.
artifacts:
  onnx: "policy.onnx"        # required within `artifacts` — the trained network
  config: "config.yaml"      # optional — deploy obs/action layout
                             #   (schema_version: wbc_tracking_params_v1); the
                             #   M2 engine consumes it.

  # Clips for playback (issue wbc-mjlab-3ne). Pick ONE form:
  #
  # (A) inline — a small, hand-curated showcase set with display metadata:
  clips:
    kind: inline
    clips:
      - id: "walk-forward"
        name: "Walk forward"
        file: "clips/walk-forward.json"
        tags: ["walk"]
        durationSec: 4.0
      - id: "turn-left"
        name: "Turn left"
        file: "clips/turn-left.json"
  #
  # (B) manifest — point at a motion_library.yaml (schema:
  #     wbc_motion_library_v1) and let per-clip names/files resolve from it.
  #     Best for the exporter's bulk output (don't copy the clip list in here):
  #
  # clips:
  #   kind: manifest
  #   file: "motion_library.yaml"
  #   default: "walk1_subject1"
