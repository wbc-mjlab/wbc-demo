# EXAMPLE POLICY — REMOVABLE PLACEHOLDER + canonical, fully-commented manifest.
#
# This folder exists for two reasons:
#   1. so the gallery renders something before any real policy is committed, and
#   2. as the reference example of every `policy.yaml` field.
# Delete `policies/_example/` once the first real policy lands. The registry
# (src/registry.ts) treats the `_example` id specially and sorts it last.
#
# Validated against policies/policy.schema.json by both the gallery build and
# `npm run validate`. See policies/README.md for the full field reference.
#
# NOTE: the artifact pointers below are shown for documentation. The schema
# validates the manifest TEXT, not file existence, so this example validates
# even though `_example/` ships no real artifacts. A REAL policy folder must
# actually contain the files it points at (and `robot: g1` to run live).

schemaVersion: "1"          # required — manifest schema version (currently "1")

# id: example               # optional — folder name is authoritative; omit it
name: "Example Policy"       # required — display name on the card and page
description: "Placeholder so the gallery isn't empty. Remove me once a real policy is added."

robot: "g1"                  # optional — embodiment id; selects the shared robot
                             #   assets in public/robots/<robot>/. Live rendering
                             #   currently supports g1.

tags: ["walk", "locomotion", "example"]   # optional — known tags suggested
                                          #   (walk/run/fight/flip/dance/…),
                                          #   arbitrary tags allowed.

author: "wbc-mjlab"          # optional — contributor name or handle

links:                       # optional — surfaced on the policy page
  paper: "https://example.com/paper"
  code: "https://github.com/wbc-mjlab/wbc-mjlab"
  runUrl: "https://wandb.ai/wbc-mjlab/example/runs/abc123"

thumbnail: "thumb.png"       # optional — gallery card image, relative to folder

defaultClip: "walk-forward"  # optional — clip id to show first on the page

# Camera framing: a named preset ("default" | "front" | "side" | "top" |
# "orbit") OR an explicit pose. Explicit form maps onto the Three.js viewport:
#   pos    -> camera.position
#   target -> orbit/look-at target
# (world-space metres, Three.js axes, Y up — see src/viewer/renderer.ts).
camera:
  pos: [2.5, 1.8, 3.0]
  target: [0.0, 0.8, 0.0]
# camera: default            # ...or just a preset name.

# Pointers to the policy's machine artifacts (emitted by the exporter,
# wbc-mjlab-export-web-reference). Paths are RELATIVE to this folder.
#   - onnx   (required within `artifacts`) — the trained network the engine runs.
#   - config — deploy obs/action layout (schema_version: wbc_tracking_params_v1).
# The live engine also reads `reference/index.json` from the folder for its clip
# list; that file is produced by the exporter alongside the per-clip .bin streams
# (see ../../REFERENCE_STREAM.md), so it isn't listed here.
artifacts:
  onnx: "policy.onnx"
  config: "config.yaml"

  # Optional `clips` metadata (a curated inline list, or a pointer to a
  # motion_library.yaml). The gallery/picker source their clips from
  # reference/index.json, so this block is informational — omit it unless you
  # want to annotate a curated subset.
  #
  # clips:
  #   kind: manifest
  #   file: "motion_library.yaml"
  #   default: "walk1_subject1"
